name: Fix account dropdown visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selectbox CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''[data-testid="stDialog"] [data-baseweb="select"] span,
[data-testid="stDialog"] [data-baseweb="select"] input,
[data-testid="stDialog"] [data-baseweb="select"] [data-baseweb="input"]{
  color:#edf2ff!important;
  -webkit-text-fill-color:#edf2ff!important;
  opacity:1!important;
}'''
          new = '''[data-testid="stDialog"] [data-baseweb="select"],
[data-testid="stDialog"] [data-baseweb="select"] *{
  color:#edf2ff!important;
  -webkit-text-fill-color:#edf2ff!important;
  opacity:1!important;
}
[data-testid="stDialog"] [data-baseweb="select"] > div,
[data-testid="stDialog"] [data-baseweb="select"] > div > div,
[data-testid="stDialog"] [data-baseweb="select"] [role="button"]{
  background:#101722!important;
  color:#edf2ff!important;
  -webkit-text-fill-color:#edf2ff!important;
}
[data-testid="stDialog"] [data-baseweb="select"] [data-baseweb="select-value"],
[data-testid="stDialog"] [data-baseweb="select"] [data-baseweb="select-value"] *{
  color:#edf2ff!important;
  -webkit-text-fill-color:#edf2ff!important;
  visibility:visible!important;
  opacity:1!important;
}
[data-testid="stDialog"] [data-baseweb="select"] svg{
  fill:#edf2ff!important;color:#edf2ff!important;
}'''
          if old not in s:
              raise SystemExit('CSS target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "Pallab Sarkar"
          git config user.email "89120698+Pallab2002@users.noreply.github.com"
          git add app.py
          git commit -m "Fix account dropdown selected text visibility"
          git push
          git rm -f .github/workflows/fix-account-dropdown.yml || true
          git commit -m "Remove temporary account dropdown workflow" || true
          git push || true
