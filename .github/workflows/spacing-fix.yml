name: Increase Streamlit component spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  spacing-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Increase UI spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = '''/* ---------- Streamlit layout safety ---------- */
          [data-testid="stHorizontalBlock"]{
            width:100%!important;max-width:100%!important;box-sizing:border-box!important;
          }
          [data-testid="stHorizontalBlock"] > [data-testid="column"]{
            min-width:0!important;max-width:100%!important;box-sizing:border-box!important;
          }
          [data-testid="stHorizontalBlock"] > [data-testid="column"] > div{
            max-width:100%!important;box-sizing:border-box!important;
          }
          [data-testid="stHorizontalBlock"] button,
          [data-testid="stHorizontalBlock"] .card,
          [data-testid="stHorizontalBlock"] .metric{
            max-width:100%!important;box-sizing:border-box!important;
          }'''

          new = '''/* ---------- Streamlit layout safety + generous spacing ---------- */
          [data-testid="stHorizontalBlock"]{
            width:100%!important;
            max-width:100%!important;
            box-sizing:border-box!important;
            display:flex!important;
            gap:18px!important;
            align-items:stretch!important;
            margin-bottom:18px!important;
          }
          [data-testid="stHorizontalBlock"] > [data-testid="column"]{
            min-width:0!important;
            max-width:100%!important;
            box-sizing:border-box!important;
            flex:1 1 0!important;
            width:0!important;
          }
          [data-testid="stHorizontalBlock"] > [data-testid="column"] > div{
            width:100%!important;
            max-width:100%!important;
            min-width:0!important;
            box-sizing:border-box!important;
          }
          [data-testid="stHorizontalBlock"] button,
          [data-testid="stHorizontalBlock"] .card,
          [data-testid="stHorizontalBlock"] .metric{
            width:100%!important;
            max-width:100%!important;
            box-sizing:border-box!important;
          }
          [data-testid="stHorizontalBlock"] + [data-testid="stHorizontalBlock"]{
            margin-top:6px!important;
          }

          /* Extra separation between major cards and sections. */
          .card{margin-bottom:18px!important;}
          .metric{margin-bottom:4px!important;}

          /* Keep calendar columns compact while still separated. */
          .day{width:100%!important;box-sizing:border-box!important;}

          /* Mobile: enough gap without making the page horizontally scroll. */
          @media(max-width:700px){
            [data-testid="stHorizontalBlock"]{
              gap:8px!important;
              margin-bottom:12px!important;
            }
            .card{margin-bottom:12px!important;}
          }'''

          if old not in s:
              raise SystemExit('Expected layout safety CSS block was not found')
          s = s.replace(old, new, 1)

          # Make the top action row explicitly less crowded.
          s = s.replace(
              'a1,a2,a3,a4,a5 = st.columns([1.15,1.15,1.15,1.15,.45])',
              'a1,a2,a3,a4,a5 = st.columns([1.05,1.05,1.05,1.05,.45], gap="medium")',
              1,
          )

          # Add comfortable spacing to navigation and account sections.
          s = s.replace(
              'c1,c2,c3,c4 = st.columns([1,1.25,1,1])',
              'c1,c2,c3,c4 = st.columns([1,1.25,1,1], gap="medium")',
              1,
          )
          s = s.replace(
              'cols = st.columns(4)',
              'cols = st.columns(4, gap="medium")',
              1,
          )
          s = s.replace(
              'a,b = st.columns(2)',
              'a,b = st.columns(2, gap="large")',
              1,
          )
          s = s.replace(
              'm1,m2 = st.columns(2)',
              'm1,m2 = st.columns(2, gap="large")',
              1,
          )
          s = s.replace(
              'd1,d2 = st.columns([1.2,.8])',
              'd1,d2 = st.columns([1.2,.8], gap="large")',
              1,
          )
          s = s.replace(
              'head = st.columns(7)',
              'head = st.columns(7, gap="small")',
              1,
          )
          s = s.replace(
              'cols = st.columns(7)',
              'cols = st.columns(7, gap="small")',
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/spacing-fix.yml
          git commit -m "Add generous spacing and prevent component overlap" || exit 0
          git push
