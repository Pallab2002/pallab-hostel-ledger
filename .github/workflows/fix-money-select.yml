name: Fix Add Money account selector

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Add Money account selector display'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix selector rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old_css = '''[data-testid="stDialog"] [data-baseweb="select"] span,
[data-testid="stDialog"] [data-baseweb="select"] input,
[data-testid="stDialog"] [data-baseweb="select"] [data-baseweb="input"]{
  color:#edf2ff!important;
  -webkit-text-fill-color:#edf2ff!important;
  opacity:1!important;
}'''
          new_css = '''[data-testid="stDialog"] [data-baseweb="select"],
[data-testid="stDialog"] [data-baseweb="select"] *{
  color:#edf2ff!important;
  -webkit-text-fill-color:#edf2ff!important;
  opacity:1!important;
  visibility:visible!important;
}
[data-testid="stDialog"] [data-baseweb="select"] > div,
[data-testid="stDialog"] [data-baseweb="select"] > div > div,
[data-testid="stDialog"] [data-baseweb="select"] [role="button"]{
  background:#101722!important;
  color:#edf2ff!important;
  -webkit-text-fill-color:#edf2ff!important;
}
[data-testid="stDialog"] [data-baseweb="select"] svg{
  fill:#edf2ff!important;color:#edf2ff!important;
}
[data-baseweb="popover"],
[data-baseweb="popover"] *{
  color:#edf2ff!important;
  -webkit-text-fill-color:#edf2ff!important;
}
[data-baseweb="popover"] [role="option"]{
  color:#edf2ff!important;background:#121927!important;
}
[data-baseweb="popover"] [role="option"]:hover{
  background:#202a3d!important;color:#fff!important;
}'''
          if old_css not in s:
              raise SystemExit('CSS target not found')
          s = s.replace(old_css, new_css, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "Pallab Sarkar"
          git config user.email "89120698+Pallab2002@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix Add Money account selector display"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-money-select.yml || true
          git commit -m "Remove temporary selector fix workflow" || true
          git push || true
