name: Fix Add Money account selector

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger selector fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix selector rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old_css = '''input,textarea,[data-baseweb="select"]>div{\n  background:#101722!important;color:#edf2ff!important;border-color:#303b50!important\n}'''
          new_css = '''input,textarea,[data-baseweb="select"]>div{\n  background:#101722!important;color:#edf2ff!important;border-color:#303b50!important\n}\n/* Fix BaseWeb select text visibility in popup forms. */\n[data-testid="stDialog"] [data-baseweb="select"] > div{\n  background:#101722!important;color:#edf2ff!important;border-color:#303b50!important;\n}\n[data-testid="stDialog"] [data-baseweb="select"] span,\n[data-testid="stDialog"] [data-baseweb="select"] input,\n[data-testid="stDialog"] [data-baseweb="select"] [data-baseweb="input"]{\n  color:#edf2ff!important;\n  -webkit-text-fill-color:#edf2ff!important;\n  opacity:1!important;\n}\n[data-testid="stDialog"] [data-baseweb="select"] svg{\n  fill:#edf2ff!important;color:#edf2ff!important;\n}\n[data-baseweb="popover"] [role="option"]{\n  color:#edf2ff!important;background:#121927!important;\n}\n[data-baseweb="popover"] [role="option"]:hover{\n  background:#202a3d!important;color:#fff!important;\n}'''
          if old_css not in s:
              raise SystemExit('CSS target not found')
          s = s.replace(old_css, new_css, 1)

          old_select = '''            account = st.selectbox(\n                "Account",\n                ["mess","canteen"],\n                index=0 if acc == "mess" else 1\n            )'''
          new_select = '''            account = st.selectbox(\n                "Account",\n                ["mess", "canteen"],\n                index=0 if acc == "mess" else 1,\n                format_func=lambda x: "🍛 Mess" if x == "mess" else "☕ Canteen",\n                key="money_account_select"\n            )'''
          if old_select not in s:
              raise SystemExit('Selectbox target not found')
          s = s.replace(old_select, new_select, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit app fix
        run: |
          git config user.name "Pallab Sarkar"
          git config user.email "89120698+Pallab2002@users.noreply.github.com"
          git add app.py
          git commit -m "Fix Add Money account selector display"
          git push

      - name: Remove temporary workflow
        run: |
          git rm -f .github/workflows/fix-money-select.yml
          git commit -m "Remove temporary selector fix workflow"
          git push
